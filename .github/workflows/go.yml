# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.26'

    - name: Build
      run: go build -v ./...

    - name: Pre-pull Docker images for integration tests
      run: |
        docker pull linuxserver/openssh-server:latest
        docker pull geerlingguy/docker-ubuntu2404-ansible:latest

    - name: Debug systemd container
      continue-on-error: true
      run: |
        echo "=== Running geerlingguy/docker-ubuntu2404-ansible manually ==="
        docker run -d --privileged --volume=/sys/fs/cgroup:/sys/fs/cgroup:rw --cgroupns=host --name systemd-debug geerlingguy/docker-ubuntu2404-ansible:latest
        sleep 5
        echo "=== Container state ==="
        docker inspect systemd-debug --format '{{.State.Status}} exit={{.State.ExitCode}} err={{.State.Error}}' || true
        echo "=== Container logs ==="
        docker logs systemd-debug 2>&1 || true
        echo "=== Host cgroup info ==="
        stat /sys/fs/cgroup 2>&1 || true
        mount | grep cgroup || true
        docker rm -f systemd-debug || true

    - name: Test
      run: go test -timeout 30m -v ./...
